services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentic-rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    gpus: all

    volumes:
      - ./finetuning/output:/app/finetuning/output
      - ./chroma_db:/app/chroma_db
      - huggingface_cache:/root/.cache/huggingface

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentic-rag-frontend

    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    ports:
      - "8501:8501"

    depends_on:
      - backend

    environment:
      BACKEND_WS_URL: ws://backend:8000/ws/agent

    env_file:
      - .env

    restart: unless-stopped


volumes:
  huggingface_cache: